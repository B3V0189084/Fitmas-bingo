<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fitmas"><meta name="theme-color" content="#153d31"><title>GYMIT Fitmas Bingo</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#18342c;background:#f4f7f3}*{box-sizing:border-box}body{margin:0}header{background:#153d31;color:white;padding:calc(env(safe-area-inset-top) + 24px) 18px 20px}h1{margin:0;font-size:27px}header p{margin:6px 0 0;color:#c7dfd1}.wrap{max-width:780px;margin:auto;padding:16px 14px 80px}.stats{display:flex;gap:10px}.stat{flex:1;background:white;border-radius:15px;padding:15px;box-shadow:0 2px 10px #173a2910}.stat strong{font-size:25px;display:block}.stat small{color:#64766c}progress{width:100%;height:12px;accent-color:#bd354b;margin:15px 0}nav{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 18px}button,.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#e4ebe5;color:#153d31;font-weight:650}button.active,.primary{background:#153d31;color:white}.challenge{background:white;border:1px solid #e0e8e1;border-radius:15px;padding:14px;margin:10px 0;display:flex;align-items:flex-start;gap:12px}.check{min-width:43px;height:43px;font-size:22px;border:2px solid #c5d6c8;background:white}.done .check{background:#1d7653;color:white;border-color:#1d7653}.content{flex:1}.content b{font-size:16px}.content p{margin:5px 0;color:#52635a;font-size:14px}.meta{font-size:12px;color:#708177;margin-top:8px}.tag{font-size:11px;background:#eaf1e9;border-radius:20px;padding:3px 7px;display:inline-block;margin:0 0 6px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.tile{font-size:11px;min-height:104px;padding:8px 5px;background:white;border:1px solid #d9e2d8;display:flex;flex-direction:column;justify-content:space-between;word-break:break-word}.tile.done{background:#d6efdf;border-color:#1d7653}.tile strong{font-size:11px}.tile span{font-size:10px;color:#617269}.panel{background:white;border-radius:15px;padding:16px;margin:12px 0}.panel p{line-height:1.5;font-size:14px}textarea{width:100%;height:125px;border:1px solid #cbd8ce;border-radius:10px;padding:10px;font-size:13px}input[type=file]{max-width:100%;margin:10px 0}footer{font-size:12px;color:#617269;margin-top:25px}#toast{position:fixed;bottom:20px;left:15px;right:15px;background:#153d31;color:white;border-radius:12px;padding:13px;display:none;text-align:center} .danger{color:#9e2538} .muted{color:#6a786e;font-size:13px} .actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0} @media(min-width:600px){.board{grid-template-columns:repeat(4,1fr)}.tile{min-height:120px;font-size:13px}}</style></head><body><header><h1>🎄 FITMAS BINGO</h1><p>GYMIT · Your challenge tracker</p></header><main class="wrap"><div class="stats"><div class="stat"><strong id="count">0/20</strong><small>Challenges complete</small></div><div class="stat"><strong id="percent">0%</strong><small>Overall progress</small></div></div><progress id="progress" max="20" value="0"></progress><nav><button class="active" data-view="list">Logical order</button><button data-view="board">Bingo board</button><button data-view="sync">Caliber sync</button><button data-view="settings">Backup</button></nav><section id="view"></section><footer>Completion times are recorded in your device's local time. Your data is stored on this device; export backups regularly.</footer></main><div id="toast" role="status"></div><script>
const tasks=[
{id:'sled',title:"Santa’s Sled Push",detail:'Push the sled 100 m (10 × 10 m laps)',cat:'Strength',order:1},
{id:'lats',title:'Deck the Lats',detail:'Complete 50 lat pulldowns',cat:'Strength',order:2},
{id:'row',title:'Reindeer Row',detail:'Row 2 km',cat:'Cardio',order:11},
{id:'squats',title:'Sleigh the Squats',detail:'Complete 100 weighted squats',cat:'Strength',order:3},
{id:'buddy',title:'Bring a Buddy',detail:'Train with a friend (first visit: free)',cat:'Community',order:16},
{id:'balls',title:'Jingle Balls',detail:'Complete 50 medicine ball slams',cat:'Strength',order:4},
{id:'sprint',title:"Santa’s Speed Sprint",detail:'Complete a 10-minute incline walk',cat:'Cardio',order:12},
{id:'pole',title:'North Pole Ascent',detail:'Climb 50 floors',cat:'Cardio',order:13},
{id:'festive',title:'Festive Strength',detail:'Complete 3 challenging sets of 8 reps',cat:'Strength',order:5},
{id:'selfie',title:'Elf Yourself',detail:'Take a festive gym selfie',cat:'Community',order:17},
{id:'deadlift',title:'Sleigh the Deadlift',detail:'Complete 50 deadlifts (trap bar / leg press)',cat:'Strength',order:6},
{id:'sack',title:"Santa’s Sack",detail:'Farmer’s carry 200 m',cat:'Strength',order:7},
{id:'kindness',title:'Gift of Kindness',detail:'Leave a positive GYMIT review',cat:'Community',order:18},
{id:'core',title:'Christmas Core',detail:'Accumulate a 5-minute plank',cat:'Strength',order:8},
{id:'snow',title:'Snowstorm',detail:'Burn 100 calories on a cardio machine',cat:'Cardio',order:14},
{id:'rudolph',title:"Rudolph’s Run",detail:'Run or walk 3 km',cat:'Cardio',order:15},
{id:'grip',title:"Grinch’s Grip",detail:'Accumulate 2 minutes hanging from a bar',cat:'Strength',order:9},
{id:'rock',title:'Jingle Bell Rock',detail:'Attend a group fitness class',cat:'Community',order:19},
{id:'workshop',title:"Santa’s Workshop",detail:'Complete 100 push-ups',cat:'Strength',order:10},
{id:'finale',title:'Fitmas Finale',detail:'Ask reception for a mystery challenge',cat:'Community',order:20}
];
const KEY='gymit-fitmas-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};let state={done:saved.done||{},evidence:saved.evidence||{},view:'list'};
function save(){localStorage.setItem(KEY,JSON.stringify({done:state.done,evidence:state.evidence}))}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2800)}function fmt(s){return s?new Date(s).toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short'}):''}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toggle(id){if(state.done[id]){if(!confirm('Remove completion for this challenge?'))return;delete state.done[id];delete state.evidence[id]}else{state.done[id]=new Date().toISOString();state.evidence[id]='Manual check-off'}save();render()}
function render(){let n=Object.keys(state.done).filter(id=>tasks.some(t=>t.id===id)).length;document.getElementById('count').textContent=n+'/20';document.getElementById('percent').textContent=Math.round(n/20*100)+'%';document.getElementById('progress').value=n;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));let v=document.getElementById('view');if(state.view==='list'){v.innerHTML='<p class="muted">Ordered by strength, cardio, then community challenges. Tap a square to record completion.</p>'+[...tasks].sort((a,b)=>a.order-b.order).map(t=>`<article class="challenge ${state.done[t.id]?'done':''}"><button class="check" onclick="toggle('${t.id}')" aria-label="Toggle ${esc(t.title)}">${state.done[t.id]?'✓':''}</button><div class="content"><span class="tag">${t.cat}</span><div><b>${esc(t.title)}</b></div><p>${esc(t.detail)}</p>${state.done[t.id]?`<div class="meta">✓ ${fmt(state.done[t.id])} · ${esc(state.evidence[t.id]||'Manual')}</div>`:''}</div></article>`).join('')}
else if(state.view==='board'){v.innerHTML='<p class="muted">Original paper layout, read left-to-right, top-to-bottom. Tap a square to tick it off.</p><div class="board">'+tasks.map(t=>`<button class="tile ${state.done[t.id]?'done':''}" onclick="toggle('${t.id}')"><strong>${esc(t.title)} ${state.done[t.id]?'✓':''}</strong><span>${esc(t.detail)}</span></button>`).join('')+'</div>'}
else if(state.view==='sync'){v.innerHTML=`<div class="panel"><h2>Sync with Caliber</h2><p>Caliber is connected to ChatGPT, not directly to this standalone app. Ask ChatGPT to review your Caliber activity and produce a <b>Fitmas sync JSON</b> file. Import it below to apply confirmed matches and preserve their recorded workout timestamps.</p><div class="actions"><button class="primary" onclick="copyPrompt()">Copy sync request</button></div><label for="syncfile"><b>Import sync JSON file</b></label><input id="syncfile" type="file" accept=".json,application/json" onchange="importSyncFile(this)"><p class="muted">Only confirmed completions should be included. Cumulative targets require the relevant full workout history. Existing check-offs won't be overwritten.</p><details><summary>Sync file format</summary><pre style="overflow:auto;font-size:11px">${esc(JSON.stringify({format:'fitmas-sync-v1',completions:[{id:'lats',completedAt:'2026-11-20T07:00:00+10:30',evidence:'Caliber: 50 lat pulldowns across logged sets'}]},null,2))}</pre></details></div>`}
else{v.innerHTML=`<div class="panel"><h2>Back up your progress</h2><p>Save a copy to Files or iCloud Drive. Import it to restore your progress if you change phones or clear Safari website data.</p><div class="actions"><button class="primary" onclick="downloadBackup()">Export backup</button><button onclick="exportCSV()">Export CSV</button></div><b>Restore a backup</b><input type="file" accept=".json,application/json" onchange="restoreFile(this)"><hr><button class="danger" onclick="resetAll()">Reset all challenges</button></div>`}}
function download(name,body,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function downloadBackup(){download('fitmas-backup.json',JSON.stringify({format:'fitmas-backup-v1',done:state.done,evidence:state.evidence},null,2),'application/json')}function exportCSV(){let rows=[['Challenge','Requirement','Category','Completed at','Source'],...tasks.map(t=>[t.title,t.detail,t.cat,state.done[t.id]?fmt(state.done[t.id]):'',state.evidence[t.id]||''])];download('fitmas-results.csv',rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}
async function restoreFile(el){try{let x=JSON.parse(await el.files[0].text());if(x.format!=='fitmas-backup-v1'||typeof x.done!=='object'||!x.done)throw Error('Not a Fitmas backup');if(!confirm('Replace current progress with this backup?'))return;state.done={};state.evidence={};for(let t of tasks){if(x.done[t.id]&&!isNaN(Date.parse(x.done[t.id]))){state.done[t.id]=x.done[t.id];state.evidence[t.id]=String(x.evidence?.[t.id]||'Restored')}}save();render();toast('Backup restored')}catch(e){alert('Could not restore: '+e.message)}}
async function importSyncFile(el){try{let x=JSON.parse(await el.files[0].text());if(x.format!=='fitmas-sync-v1'||!Array.isArray(x.completions))throw Error('Invalid Fitmas sync format');let accepted=[];for(let c of x.completions){if(!tasks.some(t=>t.id===c.id)||!c.completedAt||isNaN(Date.parse(c.completedAt))||typeof c.evidence!=='string'||!c.evidence.trim())continue;if(!state.done[c.id])accepted.push(c)}if(!accepted.length){toast('No new valid completions found');return}if(!confirm('Import '+accepted.length+' new verified completion(s)?'))return;for(let c of accepted){state.done[c.id]=new Date(c.completedAt).toISOString();state.evidence[c.id]='Caliber: '+c.evidence.slice(0,200)}save();render();toast(accepted.length+' completions imported')}catch(e){alert('Sync failed: '+e.message)}}
function copyPrompt(){let s='Review my connected Caliber workouts and cardio activities for Fitmas Bingo, from the start of my Fitmas challenge to today. Only include challenges supported by actual logged data, with exact completion timestamps where available. Do not infer unrecorded exercises or durations. Check cumulative reps across sessions and distinguish trap bar deadlifts/leg press according to the sheet. Produce a downloadable JSON file using format fitmas-sync-v1 and completions array containing id, completedAt (ISO 8601) and evidence. Challenge IDs and requirements: '+tasks.map(t=>t.id+': '+t.detail).join('; ')+'. If the challenge start date is unknown, ask me before searching.';navigator.clipboard?.writeText(s).then(()=>toast('Sync request copied')).catch(()=>{prompt('Copy this request:',s)})}function resetAll(){if(confirm('Delete ALL completed challenges on this device?')){state.done={};state.evidence={};save();render()}}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});render();
</script></body></html>
